# Déploiement Render (Blueprint) : site de TEST, séparé du site stable (tiktok-pieces).
services:
  - type: web
    name: tiktok-pieces-test
    runtime: node
    plan: free
    branch: claude/corrections-sons-images
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: ADMIN_PASSWORD
        sync: false
